<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Syne:wght@400;500;700&display=swap"
    rel="stylesheet">
  <title>fn( )</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0d0d0f;
      --surface: #141417;
      --raised: #1c1c21;
      --border: #2a2a32;
      --border-hi: #3e3e50;
      --accent: #7f77dd;
      --accent-lo: #2d2b52;
      --text: #e8e6f0;
      --muted: #7a788a;
      --danger: #d85a30;
      --mono: 'JetBrains Mono', monospace;
      --sans: 'Syne', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    /* ── Header bar ─────────────────────────────── */
    header {
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
    }

    .logo {
      font-family: var(--mono);
      font-size: 18px;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: -0.5px;
    }

    .logo span {
      color: var(--muted);
      font-weight: 400;
    }

    .tagline {
      font-size: 11px;
      color: var(--muted);
      font-family: var(--mono);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ── Input panel ────────────────────────────── */
    .input-panel {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1.25rem 2rem;
      display: flex;
      align-items: flex-end;
      gap: 1rem;
    }

    .input-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .fn-input {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--mono);
      font-size: 15px;
      padding: 10px 14px;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.15s;
      width: 100%;
    }

    .fn-input:focus {
      border-color: var(--accent);
    }

    .fn-input::placeholder {
      color: var(--muted);
    }

    .hint {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
    }

    .hint code {
      background: var(--raised);
      border: 1px solid var(--border);
      padding: 1px 5px;
      border-radius: 3px;
      color: var(--accent);
    }

    .btn-create {
      background: var(--accent);
      color: #fff;
      border: none;
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.06em;
      padding: 10px 22px;
      border-radius: 6px;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .btn-create:hover {
      opacity: 0.85;
    }

    .btn-create:active {
      transform: scale(0.97);
    }

    /* ── Functions canvas ───────────────────────── */
    #functions-wrap {
      flex: 1;
      padding: 1.5rem 2rem;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 200px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 13px;
      gap: 8px;
      border: 1px dashed var(--border);
      border-radius: 8px;
      text-align: center;
    }

    .empty-state .big {
      font-size: 28px;
      color: var(--border-hi);
    }

    #functions {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }

    /* ── Function cards ─────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      width: 260px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      transition: border-color 0.2s;
    }

    .card:hover {
      border-color: var(--border-hi);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      gap: 8px;
    }

    .card-title {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .btn-delete {
      background: transparent;
      border: 1px solid transparent;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
      flex-shrink: 0;
    }

    .btn-delete:hover {
      border-color: var(--danger);
      color: var(--danger);
    }

    .card-body {
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* variable inputs */
    .var-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .var-label {
      font-family: var(--mono);
      font-size: 13px;
      color: var(--muted);
      min-width: 14px;
    }

    .var-input {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      padding: 5px 9px;
      border-radius: 5px;
      outline: none;
      flex: 1;
      min-width: 0;
      transition: border-color 0.15s;
    }

    .var-input:focus {
      border-color: var(--accent);
    }

    /* expression preview */
    .expr-preview {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 5px 9px;
      word-break: break-all;
    }

    /* output */
    .output-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .output-equals {
      font-family: var(--mono);
      font-size: 14px;
      color: var(--muted);
    }

    .output-value {
      background: var(--accent-lo);
      border: 1px solid var(--accent);
      color: var(--accent);
      font-family: var(--mono);
      font-size: 14px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 5px;
      flex: 1;
      cursor: default;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">fn<span>()</span></div>
    <div class="tagline">Function Evaluator</div>
  </header>

  <div class="input-panel">
    <div class="input-wrap">
      <label class="input-label" for="newFunctionInput">Expression</label>
      <input type="text" id="newFunctionInput" class="fn-input" placeholder="e.g.  <x>^2 + sqrt(<y>)">
      <div class="hint">Wrap variables in angle brackets: <code>&lt;x&gt;</code> &nbsp;·&nbsp; Use <code>^</code> for
        exponents, <code>sqrt()</code> for roots</div>
    </div>
    <button id="new" class="btn-create">+ Add</button>
  </div>

  <div id="functions-wrap">
    <div class="empty-state" id="empty">
      <div class="big">f(x)</div>
      <div>No functions yet — add one above</div>
    </div>
    <div id="functions"></div>
  </div>

  <script src="./script.js"></script>
</body>

</html>
